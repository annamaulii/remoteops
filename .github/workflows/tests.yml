name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: remoteops
          POSTGRES_USER: remoteops
          POSTGRES_PASSWORD: remoteops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remoteops -d remoteops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://remoteops:remoteops@localhost:5432/remoteops
      JWT_SECRET: test-only-secret-at-least-32-characters
      WEBHOOK_SIGNING_SECRET: test-webhook-secret-at-least-32-characters
      WEBHOOK_ALLOWED_HOSTS: webhooks.example.com
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest
