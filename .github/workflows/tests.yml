name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check remoteops tests migrations/env.py

      - name: Check formatting
        run: ruff format --check remoteops tests migrations/env.py

      - name: Type check
        run: mypy remoteops

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: remoteops
          POSTGRES_USER: remoteops
          POSTGRES_PASSWORD: remoteops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remoteops -d remoteops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://remoteops:remoteops@localhost:5432/remoteops
      JWT_SECRET: test-only-secret-at-least-32-characters
      WEBHOOK_SIGNING_SECRET: test-webhook-secret-at-least-32-characters
      WEBHOOK_ALLOWED_HOSTS: webhooks.example.com
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest

  container:
    name: Container
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_SECRET: test-only-secret-at-least-32-characters
      WEBHOOK_SIGNING_SECRET: test-webhook-secret-at-least-32-characters
      WEBHOOK_ALLOWED_HOSTS: webhooks.example.com
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime image
        run: docker build --tag remoteops:test .

      - name: Start runtime stack
        run: docker compose up --build --detach --wait

      - name: Check API readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8000/ready

      - name: Stop runtime stack
        if: always()
        run: docker compose down --volumes
