services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: remoteops
      POSTGRES_USER: remoteops
      POSTGRES_PASSWORD: remoteops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoteops -d remoteops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
