databases:
  - name: remoteops-db
    databaseName: remoteops
    user: remoteops
    plan: free

services:
  - type: web
    name: remoteops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      # Render's Postgres connection string uses the bare "postgresql://"
      # scheme; this app needs "postgresql+psycopg://" (psycopg3). Copy the
      # Internal Connection String from the remoteops-db dashboard and change
      # the scheme prefix before pasting it here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: WEBHOOK_ALLOWED_HOSTS
        value: ""
      # Update if the remoteops-frontend service ends up on a different URL.
      - key: CORS_ALLOWED_ORIGINS
        value: https://remoteops-frontend.onrender.com

  - type: web
    name: remoteops-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Update if the remoteops-api service ends up on a different URL.
      - key: VITE_API_BASE_URL
        value: https://remoteops-api.onrender.com
    routes:
      # Vue Router uses history mode; without this, refreshing any route
      # other than "/" 404s.
      - type: rewrite
        source: /*
        destination: /index.html
