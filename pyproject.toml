[project]
name = "remoteops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "email-validator",
    "fastapi[standard-no-fastapi-cloud-cli]",
    "httpx",
    "psycopg[binary]",
    "pwdlib[argon2]",
    "pyjwt",
    "pydantic-settings",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["remoteops*"]
